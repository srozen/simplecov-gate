name: SimpleCov Gate
description: Fail the build when SimpleCov coverage drops below a minimum threshold.
author: Samuel Monroe

branding:
  icon: check-circle
  color: green

inputs:
  minimum-coverage:
    description: >
      Minimum required total line coverage, in percent (e.g. 90 or 99.5).
      Set at least one of the three coverage minimums.
    required: false
  minimum-branch-coverage:
    description: >
      Minimum required total branch coverage, in percent. Requires
      `enable_coverage :branch` in your SimpleCov configuration.
    required: false
  minimum-method-coverage:
    description: >
      Minimum required total method coverage, in percent. Requires
      `enable_coverage :method` in your SimpleCov configuration.
    required: false
  coverage-path:
    description: Directory containing the SimpleCov report (coverage.json or .last_run.json).
    required: false
    default: coverage
  github-token:
    description: >
      Token used to publish the verdict as a dedicated "SimpleCov Gate" check
      run on the pull request (requires `checks: write` permission).
      Set to an empty string to disable the check run.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Check SimpleCov coverage
      shell: bash
      env:
        SIMPLECOV_GATE_MINIMUM_COVERAGE: ${{ inputs.minimum-coverage }}
        SIMPLECOV_GATE_MINIMUM_BRANCH_COVERAGE: ${{ inputs.minimum-branch-coverage }}
        SIMPLECOV_GATE_MINIMUM_METHOD_COVERAGE: ${{ inputs.minimum-method-coverage }}
        SIMPLECOV_GATE_COVERAGE_PATH: ${{ inputs.coverage-path }}
        SIMPLECOV_GATE_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: ruby "${GITHUB_ACTION_PATH}/bin/simplecov-gate"
